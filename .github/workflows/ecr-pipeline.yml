name: Build and Push Docker Image to Amazon ECR

on:
  pull_request:
    branches:
      - dev
      - staging
      - main

  push:
    branches:
      - dev
      - staging
      - main

  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ecr-multi-env-capstone

jobs:
  validate:
    name: Build and test pull request
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Check out pull request code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image without pushing
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ecr-multi-env-capstone:pr-${{ github.event.pull_request.number }}

      - name: Run source validation
        run: docker run --rm ecr-multi-env-capstone:pr-${{ github.event.pull_request.number }} node --check server.js

  prepare:
    name: Determine target environment
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    outputs:
      environment: ${{ steps.environment.outputs.environment }}
      image_prefix: ${{ steps.environment.outputs.image_prefix }}

    steps:
      - name: Map branch to environment
        id: environment
        shell: bash
        run: |
          case "${GITHUB_REF_NAME}" in
            dev)
              echo "environment=dev" >> "$GITHUB_OUTPUT"
              echo "image_prefix=dev" >> "$GITHUB_OUTPUT"
              ;;
            staging)
              echo "environment=staging" >> "$GITHUB_OUTPUT"
              echo "image_prefix=staging" >> "$GITHUB_OUTPUT"
              ;;
            main)
              echo "environment=prod" >> "$GITHUB_OUTPUT"
              echo "image_prefix=prod" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported branch: ${GITHUB_REF_NAME}"
              exit 1
              ;;
          esac

  publish:
    name: Push image to Amazon ECR
    needs: prepare
    runs-on: ubuntu-latest
    environment: ${{ needs.prepare.outputs.environment }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out source code
        uses: actions/checkout@v6

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: github-ecr-capstone
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image metadata
        id: metadata
        shell: bash
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_PREFIX: ${{ needs.prepare.outputs.image_prefix }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "version_tag=${IMAGE_PREFIX}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "latest_tag=${IMAGE_PREFIX}-latest" >> "$GITHUB_OUTPUT"
          echo "image_uri=${ECR_REGISTRY}/${ECR_REPOSITORY}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build, tag, and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.metadata.outputs.image_uri }}:${{ steps.metadata.outputs.version_tag }}
            ${{ steps.metadata.outputs.image_uri }}:${{ steps.metadata.outputs.latest_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Display published image
        run: |
          echo "Published image:"
          echo "${{ steps.metadata.outputs.image_uri }}:${{ steps.metadata.outputs.version_tag }}"
          echo "${{ steps.metadata.outputs.image_uri }}:${{ steps.metadata.outputs.latest_tag }}"
