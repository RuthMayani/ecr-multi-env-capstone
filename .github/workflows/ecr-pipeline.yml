name: Build and Push Docker Image to Amazon ECR

on:
  pull_request:
    branches:
      - dev
      - staging
      - main

  push:
    branches:
      - dev
      - staging
      - main

  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ecr-multi-env-capstone

jobs:
  validate:
    name: Build and test pull request
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Check out pull request code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image without pushing
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ecr-multi-env-capstone:pr-${{ github.event.pull_request.number }}

      - name: Run source validation
        run: docker run --rm ecr-multi-env-capstone:pr-${{ github.event.pull_request.number }} node --check server.js

  prepare:
    name: Determine target environment
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    outputs:
      environment: ${{ steps.environment.outputs.environment }}
      image_prefix: ${{ steps.environment.outputs.image_prefix }}

    steps:
      - name: Map branch to environment
        id: environment
        shell: bash
        run: |
          case "${GITHUB_REF_NAME}" in
            dev)
              echo "environment=dev" >> "$GITHUB_OUTPUT"
              echo "image_prefix=dev" >> "$GITHUB_OUTPUT"
              ;;
            staging)
              echo "environment=staging" >> "$GITHUB_OUTPUT"
              echo "image_prefix=staging" >> "$GITHUB_OUTPUT"
              ;;
            main)
              echo "environment=prod" >> "$GITHUB_OUTPUT"
              echo "image_prefix=prod" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported branch: ${GITHUB_REF_NAME}"
              exit 1
              ;;
          esac

   publish:
    name: Push image to Amazon ECR
    needs: prepare
    runs-on: ubuntu-latest
    environment: ${{ needs.prepare.outputs.environment }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out source code
        uses: actions/checkout@v6

      - name: Display safe OIDC claims
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import json
          import base64
          import urllib.request

          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          url += "&audience=sts.amazonaws.com"

          request = urllib.request.Request(
              url,
              headers={
                  "Authorization":
                      "bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
              }
          )

          with urllib.request.urlopen(request) as response:
              token = json.load(response)["value"]

          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))

          safe_claims = {
              "sub": claims.get("sub"),
              "aud": claims.get("aud"),
              "repository": claims.get("repository"),
              "repository_id": claims.get("repository_id"),
              "repository_owner": claims.get("repository_owner"),
              "repository_owner_id": claims.get("repository_owner_id"),
              "environment": claims.get("environment")
          }

          print(json.dumps(safe_claims, indent=2))
          PY

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: github-ecr-capstone
          aws-region: ${{ env.AWS_REGION }}
